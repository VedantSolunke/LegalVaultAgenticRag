[project]
name = "legalvault"
version = "0.1.0"
description = "LegalVault BNS legal research assistant API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[project.scripts]
legalvault-api = "legalvault.main:run"
legalvault-ingest-bns = "legalvault.cli.ingest_bns:main"
legalvault-ingest-ipc-mapping = "legalvault.cli.ingest_ipc_mapping:main"
legalvault-eval = "legalvault.cli.eval:main"
legalvault-purge-sessions = "legalvault.cli.purge_sessions:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
